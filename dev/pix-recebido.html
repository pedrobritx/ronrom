<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Reserva de teste | Ronrom em Casa</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #332921; background: #f6f0e6; }
    main { max-width: 36rem; margin: 3rem auto; padding: 0 1rem 2rem; }
    section { background: #fffdf8; border: 1px solid #d8c8b5; border-radius: 1rem; padding: 1.25rem; }
    h1 { margin-top: .25rem; font-size: clamp(1.7rem, 5vw, 2.5rem); }
    label, button { display: block; }
    button, select { font: inherit; border: 1px solid #70503d; border-radius: .5rem; padding: .65rem .9rem; }
    select { margin: .4rem 0 1rem; background: #fff; color: #332921; }
    button { margin-top: .75rem; color: #fff; background: #70503d; }
    button:disabled { background: #ebe1d7; color: #554941; border-color: #c9b7a8; }
    [hidden] { display: none; }
    .status { border-left: .25rem solid #87654c; padding-left: .75rem; }
  </style>
</head>
<body>
  <main>
    <p>Ronrom em Casa</p>
    <h1>Reserva de teste</h1>
    <p>Demonstração com dados fictícios. O estado é reiniciado ao recarregar a página.</p>
    <section aria-label="Pagamento da reserva">
      <p>2 visitas Companhia, com medicação, mimo e uma sessão de corte de unhas.</p>
      <p>Total por Pix direto: <strong id="total"></strong></p>
      <label for="timing">Momento da cobrança</label>
      <select id="timing">
        <option value="after">Depois da última visita</option>
        <option value="before">Antes da primeira visita</option>
      </select>
      <button id="confirm" type="button">Confirmar reserva de teste</button>
      <button id="complete" type="button" hidden>Marcar última visita como concluída</button>
      <p id="status" class="status" role="status"></p>
      <p id="reminder" hidden>Confira o crédito no Nubank antes de registrar o recebimento.</p>
      <button id="receive" type="button" disabled>Pix recebido</button>
    </section>
  </main>
  <script type="module">
    import { brl, estimate } from '../src/pricing.ts';

    const timing = document.querySelector('#timing');
    const confirm = document.querySelector('#confirm');
    const complete = document.querySelector('#complete');
    const receive = document.querySelector('#receive');
    const status = document.querySelector('#status');
    const reminder = document.querySelector('#reminder');
    const quote = estimate({
      plan: 'companhia', visits: 2, cats: 1, medication: true, nails: true, treat: true,
    });

    document.querySelector('#total').textContent = brl(quote.total);
    let confirmed = false;
    let completed = false;
    let received = false;

    function pixIsPending() {
      return confirmed && !received && (timing.value === 'before' || completed);
    }

    function render() {
      timing.disabled = confirmed;
      confirm.hidden = confirmed;
      complete.hidden = !confirmed || timing.value !== 'after' || completed;
      receive.disabled = !pixIsPending();
      reminder.hidden = !pixIsPending();

      if (received) {
        status.textContent = 'Pix recebido. Pendência encerrada.';
      } else if (pixIsPending()) {
        status.textContent = 'Aguardando Pix.';
      } else if (confirmed) {
        status.textContent = 'Aguardando a conclusão da última visita.';
      } else {
        status.textContent = 'Aguardando confirmação da reserva.';
      }
    }

    confirm.addEventListener('click', () => {
      confirmed = true;
      render();
    });
    complete.addEventListener('click', () => {
      if (!confirmed || timing.value !== 'after') return;
      completed = true;
      render();
    });
    receive.addEventListener('click', () => {
      if (!pixIsPending()) return;
      received = true;
      render();
    });

    render();
  </script>
</body>
</html>
